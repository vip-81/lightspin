<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="圖文電視賭場：改編自 Ludum Dare 60《OadText》的 Casino 復古探索遊戲。輸入頁碼瀏覽隱藏頻道、解鎖老虎機與河內塔等秘密，蒐集所有頁面成為 Teletext 大師。">
<title>圖文電視賭場 · OAD TELETEXT｜LightSpin</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:#050505;color:#fff;font-family:ui-monospace,"Courier New",monospace;display:flex;justify-content:center;padding:12px 10px 24px;-webkit-tap-highlight-color:transparent}
.wrap{width:min(100%,820px)}
h1{margin:0 0 2px;text-align:center;font-size:clamp(18px,4vw,26px);letter-spacing:.06em;color:#ff0;text-shadow:0 0 8px #f00}
.sub{margin:0 0 10px;text-align:center;font-size:11px;letter-spacing:.14em;color:#0f0}
.screen{position:relative;width:100%;aspect-ratio:4/3;background:#000;border:4px solid #333;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.9),0 0 24px rgba(0,255,0,.15)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:rgba(0,0,0,.9)}
.overlay.hidden{display:none}
.overlay h2{margin:0;font-size:clamp(20px,5vw,32px);color:#ff0;text-shadow:0 0 10px #f00}
.overlay p{margin:0;font-size:13px;line-height:1.7;color:#0f0;max-width:48ch}
button.neon{cursor:pointer;min-height:38px;padding:7px 14px;border-radius:4px;font:inherit;font-weight:800;border:2px solid #0f0;color:#0f0;background:#001100;font-size:12px;transition:transform .12s ease}
button.neon:hover{transform:translateY(-2px);background:#003300}
button.neon:active{transform:translateY(0)}
button.neon.primary{border-color:#ff0;color:#000;background:#ff0}
button.neon.red{border-color:#f00;color:#f00;background:#110000}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.hud>div{background:#0a0a0a;border:1px solid #333;border-radius:4px;padding:7px 3px;text-align:center}
.hud span{display:block;font-size:10px;color:#888}
.hud strong{display:block;font-size:15px;color:#0f0;margin-top:2px}
.keypad{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:10px}
.keypad button{width:44px;height:38px;font:inherit;font-weight:800;background:#111;color:#fff;border:2px solid #555;border-radius:4px;cursor:pointer}
.keypad button:active{background:#ff0;color:#000}
.keypad button.enter{width:80px;border-color:#0f0;color:#0f0}
.keypad button.del{border-color:#f00;color:#f00}
.tips{margin:10px 2px 0;font-size:12px;line-height:1.6;color:#888;text-align:center}
.tips b{color:#ff0}
</style>
</head>
<body>
<div class="wrap">
<h1>圖文電視賭場</h1>
<p class="sub">OAD TELETEXT · PLEASE SELECT A PAGE</p>
<div class="screen">
<canvas id="game" width="800" height="600" aria-label="圖文電視賭場畫面"></canvas>
<div class="overlay" id="startScreen">
<h2>TELETEXT ONLINE</h2>
<p>復古圖文電視來了！輸入<b style="color:#ff0">三位數頁碼</b>探索隱藏頻道。<br>有些頁碼藏著老虎機、河內塔與大獎——<br>小心，遙控器有點<b style="color:#f00">不可靠</b>…</p>
<button class="neon primary" id="startBtn">開啟電視</button>
<p style="font-size:11px;color:#aaa">提示：先試 100，再試 110</p>
</div>
<div class="overlay hidden" id="winScreen">
<h2>ALL PAGES FOUND</h2>
<p>你探索了所有隱藏頻道！</p>
<div style="font-size:26px;color:#ff0" id="winScore">0 籌碼</div>
<button class="neon primary" id="winAgainBtn">再看一次</button>
</div>
</div>
<div class="hud">
<div><span>頁碼</span><strong id="hPage">100</strong></div>
<div><span>籌碼</span><strong id="hChips">0</strong></div>
<div><span>已發現</span><strong id="hFound">0/8</strong></div>
<div><span>JACKPOT</span><strong id="hJackpot">0</strong></div>
</div>
<div class="keypad" id="keypad"></div>
<p class="tips">改編自 Ludum Dare 60 作品《OadText》（OadT）的「頁碼導航 + 隱藏內容探索 + 不可靠遙控器」機制。<b>所有籌碼皆為虛擬</b>，僅供技術示範。</p>
</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var $=function(id){return document.getElementById(id);};
var W=800,H=600;
var clamp=function(v,a,b){return v<a?a:v>b?b:v;};
var rand=function(n){return (Math.random()*n)|0;};

// 頁面資料：標題、行、動作
var PAGES={
100:{title:'MAIN MENU',color:'#ff0',lines:['WELCOME TO OAD TELETEXT','','101 - SLOT MACHINE','102 - PAYOUT TABLE','110 - HIDDEN SITES','999 - SECRET','','ENTER A PAGE NUMBER...']},
101:{title:'SLOT MACHINE',color:'#0f0',lines:['INSERT COIN TO SPIN','','[SPIN] BUTTON BELOW','','3 MATCH = JACKPOT','','BACK TO 100'],slot:true},
102:{title:'PAYOUT TABLE',color:'#0ff',lines:['7 7 7 ...... 120','STAR x3 ...... 60','DIAMOND x3 ... 40','ANY PAIR ..... 15','','SEE PAGE 101'],bet:80},
110:{title:'HIDDEN SITES',color:'#f0f',lines:['YOU FOUND THE HIDDEN INDEX!','','111 - TOWER OF HANOI','112 - FORTUNE COOKIE','113 - GOLDEN EGG','','EXPLORE THEM ALL'],reward:150},
111:{title:'TOWER OF HANOI',color:'#0f0',lines:['A CLASSIC PUZZLE','','MOVE DISKS TO THE RIGHT PEG','','[SOLVE] BUTTON BELOW','','REWARD 200 CHIPS'],hanoi:true},
112:{title:'FORTUNE COOKIE',color:'#ff0',lines:['YOUR FORTUNE:','','"LUCK FAVORS THE BOLD"','','[OPEN] FOR A SURPRISE','','BACK TO 110'],fortune:true},
113:{title:'GOLDEN EGG',color:'#ff0',lines:['A SHINING GOLDEN EGG!','','[CRACK] IT OPEN','','WHO KNOWS WHAT IS INSIDE?','','BACK TO 110'],egg:true},
999:{title:'SECRET ROOM',color:'#f00',lines:['CONGRATULATIONS!','','YOU FOUND THE SECRET PAGE','','BONUS 300 CHIPS','','MASTER OF TELETEXT'],secret:true}
};
var PAGE_ORDER=[100,101,102,110,111,112,113,999];

var mode='start';
var current=100,input='',chips=0,jackpots=0;
var found={};
var shake=0,blink=0,msg='',msgTimer=0;
var reels=['7','★','◆'],slotTimer=0,slotActive=false;
var slotPay=null;
var particles=[];
var actx=null;
function unlockAudio(){try{if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function beep(f,d,ty,g){if(!actx)return;try{var t=actx.currentTime,o=actx.createOscillator(),a=actx.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);a.gain.setValueAtTime(g||.04,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){}}
function coin(){beep(880,.05,'sine',.04);}
function burst(x,y,n,c){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=50+Math.random()*160;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.4+Math.random()*.4,maxLife:.8,color:c,size:2+Math.random()*3});}}

function addMsg(t){msg=t;msgTimer=1.8;}
function updateHUD(){
$('hPage').textContent=input.length?input.padEnd(3,'_'):current;
$('hChips').textContent=chips;
$('hFound').textContent=Object.keys(found).length+'/'+PAGE_ORDER.length;
$('hJackpot').textContent=jackpots;
}
function resetGame(){current=100;input='';chips=0;jackpots=0;found={};slotActive=false;slotPay=null;reels=['7','★','◆'];particles=[];shake=0;addMsg('TUNED TO PAGE 100');updateHUD();}
function startGame(){unlockAudio();resetGame();mode='playing';$('startScreen').classList.add('hidden');$('winScreen').classList.add('hidden');coin();}

function gotoPage(num){
// 不可靠遙控器：5% 機率輸入被幹擾
if(Math.random()<0.05){var bad=100+rand(900);addMsg('REMOTE GLITCH! → '+bad);beep(120,.15,'sawtooth',.05);num=bad;}
current=num;input='';
var page=PAGES[num];
if(page){
if(!found[num]){found[num]=true;
var r=page.reward||(page.secret?300:0);
if(r>0){chips+=r;addMsg('NEW PAGE! +'+r+' CHIPS');coin();}
else addMsg('NEW PAGE DISCOVERED!');
beep(660,.1,'sine',.05);}
else addMsg('PAGE '+num);
if(page.secret){beep(523,.1,'sine',.05);setTimeout(function(){beep(659,.1,'sine',.05);},110);}
if(Object.keys(found).length>=PAGE_ORDER.length){mode='win';$('winScore').textContent=chips+' 籌碼';$('winScreen').classList.remove('hidden');}
}else{
addMsg('PAGE '+num+' NOT FOUND');beep(160,.12,'sawtooth',.04);
}
updateHUD();
}
function spinSlot(){
if(mode!=='playing')return;
if(!slotActive){slotActive=true;slotTimer=.8;slotPay=null;beep(320,.05,'square',.03);addMsg('SPINNING...');}
}
function doAction(){
var p=PAGES[current];if(!p)return;
if(p.slot){spinSlot();return;}
if(p.hanoi){chips+=200;burst(W/2,300,30,'#0f0');coin();addMsg('HANOI SOLVED! +200');updateHUD();return;}
if(p.fortune||p.egg){var r=50+rand(150);chips+=r;burst(W/2,300,20,'#ff0');coin();addMsg('SURPRISE! +'+r);updateHUD();return;}
}

function key(k){
if(mode!=='playing')return;
if(k==='del'){input='';updateHUD();return;}
if(k==='enter'){if(input.length){gotoPage(parseInt(input,10));}return;}
if(/^[0-9]$/.test(k)){if(input.length<3){input+=k;beep(440,.03,'square',.02);updateHUD();}}
}

function update(dt){
blink+=dt;shake=Math.max(0,shake-dt*2.5);
if(msgTimer>0)msgTimer-=dt;
for(var i=particles.length-1;i>=0;i--){var q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=420*dt;q.life-=dt;if(q.life<=0)particles.splice(i,1);}
if(slotActive){
slotTimer-=dt;
if(slotTimer>0){reels=[SYMBOLS[rand(SYMBOLS.length)],SYMBOLS[rand(SYMBOLS.length)],SYMBOLS[rand(SYMBOLS.length)]];}
else{
reels=['7','★','◆'].map(function(){return SYMBOLS[rand(SYMBOLS.length)];});
var pay;
if(reels[0]===reels[1]&&reels[1]===reels[2])pay=120;
else if(reels[0]===reels[1]||reels[1]===reels[2]||reels[0]===reels[2])pay=15;
else pay=5;
chips+=pay;slotPay=pay;slotActive=false;
burst(W/2,300,pay>=120?50:16,'#ff0');
beep(pay>=120?1046:660,.14,'sine',.06);
if(pay>=120){jackpots++;}
addMsg('PAYOUT +'+pay);updateHUD();
}
}
}
var SYMBOLS=['7','★','◆','▲','●'];

function fit(){var d=Math.min(window.devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
fit();window.addEventListener('resize',fit);

function render(){
ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake*8,(Math.random()-.5)*shake*8);
ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
// scanlines
ctx.fillStyle='rgba(255,255,255,.02)';for(var y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
var p=PAGES[current];
if(p){
// header bar
ctx.fillStyle=p.color;ctx.fillRect(0,0,W,70);
ctx.fillStyle='#000';ctx.font='bold 40px ui-monospace,monospace';ctx.textAlign='left';
ctx.fillText('P'+current,20,48);
ctx.textAlign='right';ctx.fillText(p.title,W-20,48);
// lines
ctx.font='bold 30px ui-monospace,monospace';ctx.textAlign='left';
p.lines.forEach(function(line,i){
var c=p.color;
if(i===0)c='#fff';
ctx.fillStyle=c;
ctx.fillText(line,40,130+i*50);
});
// slot display
if(p.slot){
for(var i=0;i<3;i++){
var rx=180+i*160,ry=330;
ctx.fillStyle='#111';ctx.fillRect(rx,ry,130,100);
ctx.strokeStyle='#0f0';ctx.lineWidth=3;ctx.strokeRect(rx,ry,130,100);
ctx.fillStyle='#ff0';ctx.font='900 60px system-ui';ctx.textAlign='center';
ctx.fillText(reels[i],rx+65,ry+70);
}
if(slotPay!==null){ctx.fillStyle='#0f0';ctx.font='bold 24px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText('+'+slotPay, W/2,470);}
}
}
// input display
ctx.fillStyle='#0f0';ctx.font='bold 28px ui-monospace,monospace';ctx.textAlign='right';
ctx.fillText(input.length?input.padEnd(3,'_'):'---',W-20,H-20);
particles.forEach(function(q){ctx.save();ctx.globalAlpha=Math.max(0,q.life/q.maxLife);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,Math.PI*2);ctx.fill();ctx.restore();});
if(msgTimer>0){ctx.save();ctx.globalAlpha=Math.min(1,msgTimer);ctx.fillStyle='#fff';ctx.font='bold 24px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText(msg,W/2,H-60);ctx.restore();}
ctx.restore();
}

// keypad
var kp=$('keypad');
['1','2','3','4','5','6','7','8','9','del','0','enter'].forEach(function(k){
var b=document.createElement('button');
b.textContent=k==='del'?'DEL':k==='enter'?'ENTER':k;
if(k==='del')b.className='del';if(k==='enter')b.className='enter';
b.addEventListener('click',function(){unlockAudio();key(k);});
kp.appendChild(b);
});

var last=performance.now(),acc=0;
function frame(now){var dt=(now-last)/1000;last=now;if(!isFinite(dt)||dt<0)dt=0;if(dt>.05)dt=.05;acc+=dt;var s=1/120,g=0;while(acc>=s&&g++<12){update(s);acc-=s;}render();requestAnimationFrame(frame);}

window.addEventListener('keydown',function(e){
unlockAudio();
if(/^[0-9]$/.test(e.key))key(e.key);
else if(e.key==='Enter')key('enter');
else if(e.key==='Backspace')key('del');
else if(e.key===' '){e.preventDefault();doAction();}
});
$('startBtn').addEventListener('click',function(e){e.stopPropagation();startGame();});
$('winAgainBtn').addEventListener('click',function(e){e.stopPropagation();startGame();});
canvas.addEventListener('pointerdown',function(e){e.preventDefault();unlockAudio();doAction();});
updateHUD();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
